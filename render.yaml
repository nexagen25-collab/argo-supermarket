services:
  - type: web
    name: argo-supermarket-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@argo.shop
      - key: ADMIN_PASSWORD
        value: admin123
      - key: DATABASE_PATH
        value: /tmp/argo-data.db
      - key: STRIPE_SECRET_KEY
        sync: false